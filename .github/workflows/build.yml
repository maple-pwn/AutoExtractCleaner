name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pystray Pillow watchdog py7zr rarfile pyinstaller
    
    - name: Generate icon
      run: python create_icon.py
    
    - name: Build executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "AutoExtractCleaner" --hidden-import "pystray._win32" --hidden-import "PIL._tkinter_finder" main.py
    
    - name: Get current date
      id: date
      run: echo "date=$(Get-Date -Format 'yyyy.MM.dd')" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.date.outputs.date }}
        name: AutoExtractCleaner v${{ steps.date.outputs.date }}
        body: |
          Auto-built Windows executable.
          
          **Download:** `AutoExtractCleaner.exe`
          
          **Usage:**
          1. Download and run
          2. Right-click tray icon to configure
          3. Add folders to monitor
        files: dist/AutoExtractCleaner.exe
        draft: false
        prerelease: false
