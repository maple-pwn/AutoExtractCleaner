name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pystray Pillow watchdog py7zr rarfile pyinstaller win10toast
    
    - name: Generate icon
      run: python create_icon.py
    
    - name: Build executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "AutoExtractCleaner" --icon "icon.ico" --hidden-import "pystray._win32" --hidden-import "PIL._tkinter_finder" --hidden-import "win10toast" main.py
    
    - name: Get version info
      id: version
      run: |
        $date = Get-Date -Format 'yyyy.MM.dd'
        $sha = "${{ github.sha }}".Substring(0,7)
        $run = "${{ github.run_number }}"
        echo "date=$date" >> $env:GITHUB_OUTPUT
        echo "sha=$sha" >> $env:GITHUB_OUTPUT
        echo "tag=v$date.$run" >> $env:GITHUB_OUTPUT
    
    - name: Calculate checksum
      id: checksum
      run: |
        $hash = (Get-FileHash -Path "dist/AutoExtractCleaner.exe" -Algorithm SHA256).Hash
        echo "sha256=$hash" >> $env:GITHUB_OUTPUT
        echo "SHA256: $hash"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoExtractCleaner-Windows
        path: dist/AutoExtractCleaner.exe
        retention-days: 30

    - name: Delete existing release with same tag
      run: |
        gh release delete ${{ steps.version.outputs.tag }} --yes || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: 压缩包自动清理 ${{ steps.version.outputs.tag }}
        body: |
          ## 下载
          
          **[AutoExtractCleaner.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/AutoExtractCleaner.exe)** - Windows 可执行文件
          
          ## 校验和
          
          ```
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          ```
          
          ## 功能特性
          
          - 系统托盘运行，不占用任务栏
          - 监控文件夹，解压后自动删除压缩包
          - 内置手动解压功能，一键解压删除
          - 支持格式：ZIP, RAR, 7Z, TAR, GZ, BZ2, XZ
          - 可选开机自启动
          - Windows 10/11 通知提醒
          
          ## 使用方法
          
          1. 下载并运行 `AutoExtractCleaner.exe`
          2. 右键点击托盘图标 → 设置
          3. 添加要监控的文件夹（如"下载"文件夹）
          4. 当你解压压缩包时，原文件会自动删除
          
          ---
          构建: ${{ steps.version.outputs.sha }} | ${{ steps.version.outputs.date }}
        files: dist/AutoExtractCleaner.exe
        draft: false
        prerelease: false
        make_latest: true
