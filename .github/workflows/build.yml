name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pystray Pillow watchdog py7zr rarfile pyinstaller
    
    - name: Generate icon
      run: python create_icon.py
    
    - name: Build executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "AutoExtractCleaner" --hidden-import "pystray._win32" --hidden-import "PIL._tkinter_finder" main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoExtractCleaner-Windows
        path: dist/AutoExtractCleaner.exe
        retention-days: 30
